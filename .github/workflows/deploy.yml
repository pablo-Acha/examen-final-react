name: Validar y desplegar en Render
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-production
  cancel-in-progress: false
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  deploy:
    name: Publicar y verificar en Render
    needs: [lint, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://examen-final-react.onrender.com
    env:
      E2E_BASE_URL: https://examen-final-react.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Desplegar el commit validado y esperar su disponibilidad
        run: node scripts/deploy-render.mjs
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Probar el juego publicado
        run: npm run test:e2e
      - name: Guardar reporte de producción
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-produccion
          path: |
            playwright-report/
            test-results/
          retention-days: 7
