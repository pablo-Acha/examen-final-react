name: Linters de frontend y backend
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Validar ambos paquetes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run lint
